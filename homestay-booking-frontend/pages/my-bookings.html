<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch đặt phòng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
<main>
<section id="section-my-bookings" class="app-section active">
  <div class="container-xl py-5 mt-5">
    <h2 class="page-title mb-4">Lịch đặt phòng của tôi</h2>

    <ul class="nav nav-pills booking-tabs mb-4" id="bookingTabs">
      <li class="nav-item"><button class="nav-link active">Tất cả</button></li>
      <li class="nav-item"><button class="nav-link">Chờ xác nhận</button></li>
      <li class="nav-item"><button class="nav-link">Đã xác nhận</button></li>
      <li class="nav-item"><button class="nav-link">Hoàn thành</button></li>
      <li class="nav-item"><button class="nav-link">Đã hủy</button></li>
      <li class="nav-item"><button class="nav-link"><i class="bi bi-receipt me-1"></i>Hoá đơn</button></li>
    </ul>

    <!-- Booking list tab -->
    <div id="my-bookings-tab-list">
      <div id="my-bookings-list">
        <div class="booking-list-item skeleton-booking mb-3"></div>
        <div class="booking-list-item skeleton-booking mb-3"></div>
        <div class="booking-list-item skeleton-booking mb-3"></div>
      </div>
    </div>

    <!-- Invoice tab -->
    <div id="my-bookings-tab-invoices" class="d-none">
      <h5 class="fw-600 mb-3">Hoá đơn của tôi</h5>
      <div id="my-invoices-list">
        <div class="text-center py-4"><div class="spinner-border spinner-border-sm text-brand"></div></div>
      </div>
    </div>

    <!-- Review modal -->
    <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-brand">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title">Đánh giá homestay</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small">Điểm đánh giá</label>
              <div class="d-flex gap-2" id="modal-star-rating">
                <button type="button" class="btn p-0 modal-star-btn" data-star="1" style="font-size:1.8rem;color:#ccc;"><i class="bi bi-star-fill"></i></button>
                <button type="button" class="btn p-0 modal-star-btn" data-star="2" style="font-size:1.8rem;color:#ccc;"><i class="bi bi-star-fill"></i></button>
                <button type="button" class="btn p-0 modal-star-btn" data-star="3" style="font-size:1.8rem;color:#ccc;"><i class="bi bi-star-fill"></i></button>
                <button type="button" class="btn p-0 modal-star-btn" data-star="4" style="font-size:1.8rem;color:#ccc;"><i class="bi bi-star-fill"></i></button>
                <button type="button" class="btn p-0 modal-star-btn" data-star="5" style="font-size:1.8rem;color:#ccc;"><i class="bi bi-star-fill"></i></button>
              </div>
              <input type="hidden" id="modal-review-rating" value="5" />
            </div>
            <div class="mb-3">
              <label class="form-label small">Nhận xét <span class="text-danger">*</span></label>
              <textarea id="modal-review-comment" class="form-control form-control-brand" rows="4" placeholder="Chia sẻ trải nghiệm của bạn về homestay..."></textarea>
            </div>
            <input type="hidden" id="modal-review-homestay-id" />
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="button" class="btn btn-brand" id="btn-submit-modal-review">
              <span class="spinner-border spinner-border-sm d-none me-1"></span>Gửi đánh giá
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Invoice detail modal -->
<div class="modal fade" id="invoice-detail-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-brand">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title"><i class="bi bi-receipt me-2"></i>Chi tiết hoá đơn</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <table class="table table-sm">
          <tbody>
            <tr><th class="text-muted fw-normal small" style="width:45%">Phòng</th><td class="fw-600" id="inv-room-name">—</td></tr>
            <tr><th class="text-muted fw-normal small">Homestay</th><td id="inv-homestay-name">—</td></tr>
            <tr><th class="text-muted fw-normal small">Check-in</th><td id="inv-checkin">—</td></tr>
            <tr><th class="text-muted fw-normal small">Check-out</th><td id="inv-checkout">—</td></tr>
            <tr><th class="text-muted fw-normal small">Số đêm</th><td id="inv-nights">—</td></tr>
            <tr><th class="text-muted fw-normal small">Giá/đêm</th><td id="inv-price-per-night">—</td></tr>
            <tr><th class="text-muted fw-normal small">Tạm tính</th><td id="inv-room-price">—</td></tr>
            <tr><th class="text-muted fw-normal small">Giảm giá</th><td id="inv-discount">—</td></tr>
            <tr><th class="text-muted fw-normal small fw-600">Tổng cộng</th><td class="fw-700 text-brand" id="inv-total">—</td></tr>
            <tr><th class="text-muted fw-normal small">Ngày thanh toán</th><td id="inv-payment-date">—</td></tr>
          </tbody>
        </table>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
      </div>
    </div>
  </div>
</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/features/my-bookings/my-bookings-init.js"></script>
</body>
</html>
