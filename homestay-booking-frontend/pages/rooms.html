<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homestay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
<main>
<section id="section-rooms" class="app-section active">
  <div class="container-xl py-5 mt-5">
    <div class="row">
      <!-- Filter Sidebar -->
      <div class="col-lg-3 mb-4">
        <div class="filter-sidebar">
          <h5 class="filter-title"><i class="bi bi-sliders me-2"></i>Bộ lọc</h5>

          <div class="filter-group">
            <label class="filter-label">Loại phòng</label>
            <div class="form-check">
              <input class="form-check-input check-brand" type="checkbox" id="f-single" value="single">
              <label class="form-check-label" for="f-single">Phòng Đơn</label>
            </div>
            <div class="form-check">
              <input class="form-check-input check-brand" type="checkbox" id="f-double" value="double">
              <label class="form-check-label" for="f-double">Phòng Đôi</label>
            </div>
            <div class="form-check">
              <input class="form-check-input check-brand" type="checkbox" id="f-family" value="family">
              <label class="form-check-label" for="f-family">Phòng Gia Đình</label>
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-label">Sức chứa (khách)</label>
            <div class="d-flex gap-2 align-items-center">
              <input type="number" id="f-capacity-min" class="form-control form-control-sm" placeholder="Tối thiểu" min="1">
              <span class="text-muted">—</span>
              <input type="number" id="f-capacity-max" class="form-control form-control-sm" placeholder="Tối đa" min="1">
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-label">Giá / đêm (VNĐ)</label>
            <div class="d-flex gap-2 align-items-center">
              <input type="number" id="f-price-min" class="form-control form-control-sm" placeholder="Từ" step="100000">
              <span class="text-muted">—</span>
              <input type="number" id="f-price-max" class="form-control form-control-sm" placeholder="Đến" step="100000">
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-label">Tiện ích</label>
            <div class="form-check">
              <input class="form-check-input check-brand" type="checkbox" id="f-wifi" value="wifi">
              <label class="form-check-label" for="f-wifi"><i class="bi bi-wifi me-1"></i>WiFi</label>
            </div>
            <div class="form-check">
              <input class="form-check-input check-brand" type="checkbox" id="f-ac" value="ac">
              <label class="form-check-label" for="f-ac"><i class="bi bi-wind me-1"></i>Điều hòa</label>
            </div>
            <div class="form-check">
              <input class="form-check-input check-brand" type="checkbox" id="f-parking" value="parking">
              <label class="form-check-label" for="f-parking"><i class="bi bi-p-circle me-1"></i>Bãi đỗ xe</label>
            </div>
            <div class="form-check">
              <input class="form-check-input check-brand" type="checkbox" id="f-pool" value="pool">
              <label class="form-check-label" for="f-pool"><i class="bi bi-water me-1"></i>Hồ bơi</label>
            </div>
          </div>

          <button class="btn btn-brand-outline w-100 mt-2">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Đặt lại bộ lọc
          </button>
        </div>
      </div>

      <!-- Room Cards Grid -->
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <div>
            <h4 class="page-title mb-0">Danh sách Homestay</h4>
            <p class="text-muted small mt-1 mb-0">
              Tìm thấy <strong id="rooms-count" data-bind="total_count">—</strong> homestay phù hợp
            </p>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <label class="form-label mb-0 text-muted small">Sắp xếp:</label>
            <select class="form-select form-select-sm sort-select" id="sort-select" data-field="sort">
              <option value="popular">Phổ biến nhất</option>
              <option value="price_asc">Giá tăng dần</option>
              <option value="price_desc">Giá giảm dần</option>
              <option value="rating">Đánh giá cao nhất</option>
            </select>
          </div>
        </div>

        <!-- Room Cards -->
        <div class="row g-4" id="rooms-list">
          <!-- Skeleton placeholders (replaced by JS/API) -->
          <div class="col-12 col-md-6 col-xl-4"><div class="room-card skeleton-card"></div></div>
          <div class="col-12 col-md-6 col-xl-4"><div class="room-card skeleton-card"></div></div>
          <div class="col-12 col-md-6 col-xl-4"><div class="room-card skeleton-card"></div></div>
          <div class="col-12 col-md-6 col-xl-4"><div class="room-card skeleton-card"></div></div>
          <div class="col-12 col-md-6 col-xl-4"><div class="room-card skeleton-card"></div></div>
          <div class="col-12 col-md-6 col-xl-4"><div class="room-card skeleton-card"></div></div>
        </div>

        <!-- Pagination -->
        <nav class="mt-5" aria-label="Phân trang" id="rooms-pagination">
          <ul class="pagination pagination-brand justify-content-center" id="pagination-list">
            <!-- Rendered by JS -->
          </ul>
        </nav>
      </div>
    </div>
  </div>
</section>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/features/rooms/rooms-init.js"></script>
</body>
</html>
