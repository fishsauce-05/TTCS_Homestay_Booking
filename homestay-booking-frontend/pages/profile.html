<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ cá nhân</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
<main>
<section id="section-profile" class="app-section active">
  <div class="container-xl py-5 mt-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <span class="section-label">Tài khoản</span>
        <h2 class="page-title mb-0">Hồ sơ cá nhân</h2>
      </div>
    </div>

    <ul class="nav nav-pills booking-tabs mb-4" id="profileTabs">
      <li class="nav-item"><button class="nav-link active"><i class="bi bi-person me-1"></i>Thông tin</button></li>
      <li class="nav-item"><button class="nav-link"><i class="bi bi-lock me-1"></i>Đổi mật khẩu</button></li>
    </ul>

    <!-- Tab: Thông tin cá nhân -->
    <div id="profile-tab-info">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div class="checkout-card p-4">
            <div class="text-center mb-4">
              <div class="user-avatar-circle mx-auto mb-2" id="profile-avatar-display" style="width:72px;height:72px;font-size:2rem;display:flex;align-items:center;justify-content:center;">A</div>
              <div class="fw-600 fs-5" id="profile-display-name">—</div>
              <div class="text-muted small" id="profile-display-role">—</div>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small">Họ và tên <span class="text-danger">*</span></label>
                <input type="text" id="profile-fullname" class="form-control form-control-brand" placeholder="Nguyễn Văn A" />
              </div>
              <div class="col-md-6">
                <label class="form-label small">Tên hiển thị</label>
                <input type="text" id="profile-nickname" class="form-control form-control-brand" placeholder="Tên hiển thị" disabled />
              </div>
              <div class="col-md-6">
                <label class="form-label small">Email</label>
                <input type="email" id="profile-email" class="form-control form-control-brand" disabled />
              </div>
              <div class="col-md-6">
                <label class="form-label small">Số điện thoại</label>
                <input type="text" id="profile-phone" class="form-control form-control-brand" placeholder="0912345678" />
              </div>
              <div class="col-12">
                <label class="form-label small">Địa chỉ</label>
                <input type="text" id="profile-address" class="form-control form-control-brand" placeholder="123 Đường ABC, Quận 1, TP.HCM" />
              </div>
              <div class="col-12">
                <label class="form-label small">Avatar URL</label>
                <input type="text" id="profile-avatar" class="form-control form-control-brand" placeholder="https://example.com/avatar.jpg" />
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button class="btn btn-brand" id="btn-save-profile">
                <span class="spinner-border spinner-border-sm d-none me-1" id="spinner-save-profile"></span>
                <i class="bi bi-check-lg me-1"></i>Lưu thay đổi
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab: Đổi mật khẩu -->
    <div id="profile-tab-password" class="d-none">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="checkout-card p-4">
            <h6 class="fw-600 mb-3">Đổi mật khẩu</h6>
            <div class="mb-3">
              <label class="form-label small">Mật khẩu hiện tại <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="password" id="pw-current" class="form-control form-control-brand" placeholder="••••••••" />
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="pw-current"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small">Mật khẩu mới <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="password" id="pw-new" class="form-control form-control-brand" placeholder="Ít nhất 8 ký tự" />
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="pw-new"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="password" id="pw-confirm" class="form-control form-control-brand" placeholder="Nhập lại mật khẩu mới" />
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="pw-confirm"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <button class="btn btn-brand w-100" id="btn-change-password">
              <span class="spinner-border spinner-border-sm d-none me-1" id="spinner-change-pw"></span>
              <i class="bi bi-shield-lock me-1"></i>Đổi mật khẩu
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/features/profile/profile-init.js"></script>
</body>
</html>
