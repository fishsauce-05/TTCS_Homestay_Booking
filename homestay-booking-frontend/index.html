<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fishsauce Homestay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
<main>
<section id="section-home" class="app-section active">

  <!-- HERO BANNER -->
  <div class="hero-banner">
    <div class="hero-overlay"></div>
    <div class="hero-content container-xl">
      <span class="hero-badge">Trải nghiệm đích thực</span>
      <h1 class="hero-title">Tìm nơi nghỉ dưỡng<br /><em>hoàn hảo cho bạn</em></h1>
      <p class="hero-subtitle">Khám phá hàng nghìn homestay được tuyển chọn kỹ lưỡng trên khắp Việt Nam</p>

      <!-- SEARCH BAR -->
      <div class="search-bar">
        <div class="search-bar-inner">
          <div class="sb-field sb-field--wide">
            <label class="sb-label" for="search-location">
              <i class="bi bi-geo-alt-fill"></i>Địa điểm
            </label>
            <input
              type="text"
              id="search-location"
              class="sb-input"
              placeholder="Thành phố, tỉnh..."
              autocomplete="off"
              data-field="location"
            />
          </div>
          <div class="sb-divider"></div>
          <div class="sb-field">
            <label class="sb-label" for="search-checkin">
              <i class="bi bi-calendar3"></i>Check-in
            </label>
            <input type="date" id="search-checkin" class="sb-input" data-field="checkin" />
          </div>
          <div class="sb-divider"></div>
          <div class="sb-field">
            <label class="sb-label" for="search-checkout">
              <i class="bi bi-calendar3-fill"></i>Check-out
            </label>
            <input type="date" id="search-checkout" class="sb-input" data-field="checkout" />
          </div>
          <div class="sb-divider"></div>
          <div class="sb-field">
            <label class="sb-label" for="search-guests">
              <i class="bi bi-people-fill"></i>Số khách
            </label>
            <select id="search-guests" class="sb-input" data-field="guests">
              <option value="">Chọn...</option>
              <option value="1">1 khách</option>
              <option value="2">2 khách</option>
              <option value="3">3 khách</option>
              <option value="4">4 khách</option>
              <option value="5">5+ khách</option>
            </select>
          </div>
          <button class="sb-btn" id="btn-search">
            <i class="bi bi-search"></i>
            <span>Tìm kiếm</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- FEATURED CATEGORIES -->
  <section class="categories-section">
    <div class="container-xl">
      <div class="section-header text-center mb-5">
        <span class="section-label">Khám phá</span>
        <h2 class="section-title">Điểm đến nổi bật</h2>
        <p class="section-subtitle">Tìm kiếm không gian nghỉ dưỡng lý tưởng theo phong cách của bạn</p>
      </div>
      <div class="categories-grid" id="categories-list">
        <div class="category-card skeleton-item"><div class="category-card-icon skeleton-icon"></div><div class="skeleton-text-sm mt-2"></div></div>
        <div class="category-card skeleton-item"><div class="category-card-icon skeleton-icon"></div><div class="skeleton-text-sm mt-2"></div></div>
        <div class="category-card skeleton-item"><div class="category-card-icon skeleton-icon"></div><div class="skeleton-text-sm mt-2"></div></div>
        <div class="category-card skeleton-item"><div class="category-card-icon skeleton-icon"></div><div class="skeleton-text-sm mt-2"></div></div>
        <div class="category-card skeleton-item"><div class="category-card-icon skeleton-icon"></div><div class="skeleton-text-sm mt-2"></div></div>
        <div class="category-card skeleton-item"><div class="category-card-icon skeleton-icon"></div><div class="skeleton-text-sm mt-2"></div></div>
      </div>
    </div>
  </section>

  <!-- FEATURED ROOMS (Home preview) -->
  <div class="container-xl pb-5">
    <div class="section-header d-flex justify-content-between align-items-end mb-4">
      <div>
        <span class="section-label">Gợi ý</span>
        <h2 class="section-title mb-0">Homestay được yêu thích</h2>
      </div>
      <a class="btn-text-link" href="#">Xem tất cả <i class="bi bi-arrow-right ms-1"></i></a>
    </div>
    <div class="row g-4" id="featured-rooms-list">
      <!-- Skeleton cards while loading -->
      <div class="col-12 col-sm-6 col-lg-4"><div class="room-card skeleton-card"></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="room-card skeleton-card"></div></div>
      <div class="col-12 col-sm-6 col-lg-4"><div class="room-card skeleton-card"></div></div>
    </div>
  </div>

</section>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./js/features/home/home-init.js"></script>
</body>
</html>
